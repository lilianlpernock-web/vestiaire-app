<style>
  :root{
    --bg-deep:#14201A;
    --panel:#1B2A22;
    --panel-2:#22352A;
    --turf:#2F6B3F;
    --turf-light:#4C9A5F;
    --chalk:#F2EFE4;
    --chalk-dim:#B9C2B7;
    --amber:#FFB238;
    --coral:#FF5A45;
    --sky:#3EC6E0;
    --line:rgba(242,239,228,0.12);
  }
  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  body{
    margin:0;
    background:
      radial-gradient(circle at 20% -10%, rgba(76,154,95,0.25), transparent 45%),
      var(--bg-deep);
    color:var(--chalk);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
  }
  .display{font-family:'Anton', sans-serif; letter-spacing:0.02em; text-transform:uppercase;}
  .mono{font-family:'Roboto Mono', monospace;}
  .wrap{max-width:520px; margin:0 auto; padding:20px 18px 60px;}
 
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px;}
  .brand{font-size:26px; line-height:1;}
  .brand span{color:var(--amber);}
  .streak{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:8px 14px;
    text-align:center;
    min-width:70px;
  }
  .streak .num{font-family:'Roboto Mono',monospace; font-size:22px; font-weight:700; color:var(--amber); line-height:1;}
  .streak .lbl{font-size:9px; letter-spacing:0.12em; color:var(--chalk-dim); text-transform:uppercase; margin-top:2px;}
 
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px;
    margin-bottom:16px;
  }
  h1.display{font-size:34px; margin:6px 0 6px;}
  h2.display{font-size:20px; margin:0 0 14px;}
  p.sub{color:var(--chalk-dim); font-size:14px; margin:0 0 20px; line-height:1.5;}
 
  label{display:block; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:var(--chalk-dim); margin:16px 0 8px;}
  label:first-of-type{margin-top:0;}
  input[type=text], input[type=number], select{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--chalk);
    border-radius:8px; padding:12px 14px; font-family:'Work Sans',sans-serif; font-size:15px;
  }
  input:focus, select:focus, button:focus-visible, .choice:focus-visible{outline:2px solid var(--amber); outline-offset:2px;}
 
  .choices{display:flex; gap:8px; flex-wrap:wrap;}
  .choice{
    flex:1; min-width:90px; text-align:center; padding:10px 8px; border-radius:8px;
    border:1px solid var(--line); background:var(--panel-2); cursor:pointer; font-size:13px; color:var(--chalk-dim);
  }
  .choice.active{border-color:var(--amber); color:var(--bg-deep); background:var(--amber); font-weight:600;}
 
  button.primary{
    width:100%; margin-top:24px; background:var(--coral); color:var(--chalk); border:none;
    border-radius:10px; padding:15px; font-family:'Anton',sans-serif; font-size:16px; letter-spacing:0.04em;
    cursor:pointer; text-transform:uppercase;
  }
  button.primary:active{transform:scale(0.98);}
  button.primary:disabled{opacity:0.5; cursor:default;}
  button.ghost{
    width:100%; margin-top:10px; background:transparent; color:var(--chalk-dim); border:1px solid var(--line);
    border-radius:10px; padding:12px; font-family:'Work Sans',sans-serif; font-size:13px; cursor:pointer;
  }
 
  .cat-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:4px;}
  .cat{
    border-radius:12px; padding:16px 14px; cursor:pointer; border:1px solid var(--line);
    background:var(--panel-2); position:relative; overflow:hidden;
  }
  .cat .tag{font-family:'Roboto Mono',monospace; font-size:10px; color:var(--chalk-dim); letter-spacing:0.08em;}
  .cat .name{font-family:'Anton',sans-serif; font-size:18px; margin-top:6px; text-transform:uppercase;}
  .cat.force{border-left:4px solid var(--coral);}
  .cat.cardio{border-left:4px solid var(--amber);}
  .cat.poids{border-left:4px solid var(--sky); grid-column:1/3;}
  .cat.mix{border-left:4px solid var(--turf-light); grid-column:1/3;}
  .cat.frigo{border-left:4px solid #8CD9A6; grid-column:1/3;}
 
  .badge-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
  .badge{
    background:var(--panel-2); border:1px solid var(--line); border-radius:20px;
    padding:6px 12px; font-size:12px; color:var(--chalk-dim);
  }
  .badge.unlocked{color:var(--bg-deep); background:var(--amber); border-color:var(--amber); font-weight:600;}
 
  .ex-item{
    padding:14px; border-radius:10px; background:var(--panel-2); border:1px solid var(--line); margin-bottom:10px;
  }
  .ex-item.done{opacity:0.45;}
  .ex-row{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .ex-name{font-weight:600; font-size:15px;}
  .ex-meta{font-size:12px; color:var(--chalk-dim); margin-top:2px;}
  .ex-set-tag{font-size:11px; color:var(--amber); margin-top:3px; font-family:'Roboto Mono',monospace;}
  .ex-check{
    width:32px; height:32px; border-radius:50%; border:2px solid var(--turf-light); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; cursor:pointer; background:transparent; color:transparent; font-size:13px;
  }
  .ex-item.done .ex-check{background:var(--turf-light); color:var(--bg-deep); font-weight:700;}
  .ex-info-btn{
    margin-top:10px; background:transparent; border:1px dashed var(--line); color:var(--chalk-dim);
    border-radius:8px; padding:8px 10px; font-size:12px; cursor:pointer; width:100%; text-align:left;
  }
  .ex-info-btn span{color:var(--amber); font-weight:700; margin-right:6px;}
  .ex-steps{margin-top:10px; padding-top:10px; border-top:1px solid var(--line); display:none;}
  .ex-steps.open{display:block;}
  .ex-steps ol{margin:0; padding-left:18px; font-size:13px; color:var(--chalk-dim); line-height:1.6;}
  .ex-steps li{margin-bottom:4px;}
 
  .demo-wrap{background:var(--bg-deep); border-radius:10px; padding:10px 0 8px; margin-bottom:10px; display:flex; flex-direction:column; align-items:center;}
  .demo-label{font-family:'Roboto Mono',monospace; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--chalk-dim); margin-bottom:6px;}
  .demo-svg{width:150px; height:159px; overflow:visible;}
  .rig .seg-torso{stroke:var(--chalk); stroke-width:7; stroke-linecap:round;}
  .rig .seg-limb{stroke:var(--turf-light); stroke-width:6; stroke-linecap:round;}
  .rig .seg-arm{stroke:var(--amber); stroke-width:5; stroke-linecap:round;}
  .rig .seg-foot{stroke:var(--chalk-dim); stroke-width:4; stroke-linecap:round;}
  .rig .joint{fill:var(--bg-deep); stroke:var(--chalk); stroke-width:2;}
  .rig .head{fill:var(--amber);}
  .rig .ground-line{stroke:var(--line); stroke-width:2; stroke-dasharray:4 3;}

  .scoreboard{
    background:var(--bg-deep); border:1px solid var(--line); border-radius:12px; padding:24px;
    text-align:center; margin:8px 0 20px;
  }
  .scoreboard .digits{font-family:'Roboto Mono',monospace; font-size:52px; font-weight:700; color:var(--amber); letter-spacing:0.05em;}
  .scoreboard .of{font-size:11px; color:var(--chalk-dim); letter-spacing:0.1em; text-transform:uppercase; margin-top:6px;}
  .scoreboard .set-of{font-size:12px; color:var(--sky); margin-top:8px; letter-spacing:0.06em; text-transform:uppercase;}
  .scoreboard.resting .digits{color:var(--sky);}
 
  .progress-bar{height:6px; background:var(--panel-2); border-radius:4px; overflow:hidden; margin-bottom:20px;}
  .progress-bar .fill{height:100%; background:var(--turf-light); transition:width 0.3s;}
 
  .center{text-align:center;}
  .big-emoji{font-size:44px; margin-bottom:8px;}
  .hidden{display:none;}
  .top-link{background:none; border:none; color:var(--chalk-dim); font-size:13px; cursor:pointer; padding:0;}
 
  .fridge-drop{
    border:2px dashed var(--line); border-radius:12px; padding:26px 16px; text-align:center; cursor:pointer;
    color:var(--chalk-dim); font-size:13px; margin-top:6px;
  }
  .fridge-drop .fridge-emoji{font-size:36px; display:block; margin-bottom:8px;}
  .fridge-preview{width:100%; border-radius:10px; margin-top:14px; max-height:220px; object-fit:cover; display:none;}
  .fridge-preview.show{display:block;}
  .recipe-card{background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:14px; margin-top:12px;}
  .recipe-card h3{font-family:'Anton',sans-serif; font-size:16px; margin:0 0 6px; text-transform:uppercase; color:var(--amber);}
  .recipe-card p{font-size:13px; color:var(--chalk-dim); margin:0 0 8px; line-height:1.5;}
  .recipe-card .ing{font-size:12px; color:var(--sky);}
  .spinner{
    width:26px; height:26px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--amber);
    margin:16px auto; animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>

const REST_SECONDS = 15;
 
let profile=null, stats=null, currentSession=null, timerHandle=null;
 
const hasClaudeStorage = typeof window.storage !== 'undefined';
async function storageGet(key){
  if(hasClaudeStorage){
    try{ const r = await window.storage.get(key, false); return r ? r.value : null; }catch(e){ return null; }
  }
  return localStorage.getItem(key);
}
async function storageSet(key, value){
  if(hasClaudeStorage){
    try{ await window.storage.set(key, value, false); }catch(e){}
  } else {
    try{ localStorage.setItem(key, value); }catch(e){}
  }
}
 
async function loadState(){
  try{ const p = await storageGet('profile'); profile = p ? JSON.parse(p) : null; }
  catch(e){ profile = null; }
  try{ const s = await storageGet('stats'); stats = s ? JSON.parse(s) : null; }
  catch(e){ stats = null; }
  if(!stats) stats = {streak:0, lastDate:null, totalSessions:0, badges:[]};
}
async function saveProfile(){ await storageSet('profile', JSON.stringify(profile)); }
async function saveStats(){ await storageSet('stats', JSON.stringify(stats)); }
 
function todayStr(){ return new Date().toISOString().slice(0,10); }
 
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }

const REDUCE_MOTION = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function buildRig(poses, keyTimes, dur){
  const p0 = poses[0];
  const animated = !REDUCE_MOTION && poses.length>1;
  const splines = poses.slice(1).map(()=>'0.4 0 0.2 1').join(';');
  function seg(a,b,cls){
    let anim = '';
    if(animated){
      const x1=poses.map(p=>p[a][0]).join(';'), y1=poses.map(p=>p[a][1]).join(';');
      const x2=poses.map(p=>p[b][0]).join(';'), y2=poses.map(p=>p[b][1]).join(';');
      const kt=keyTimes.join(';');
      anim = `<animate attributeName="x1" values="${x1}" keyTimes="${kt}" dur="${dur}s" repeatCount="indefinite" calcMode="spline" keySplines="${splines}"/>
        <animate attributeName="y1" values="${y1}" keyTimes="${kt}" dur="${dur}s" repeatCount="indefinite" calcMode="spline" keySplines="${splines}"/>
        <animate attributeName="x2" values="${x2}" keyTimes="${kt}" dur="${dur}s" repeatCount="indefinite" calcMode="spline" keySplines="${splines}"/>
        <animate attributeName="y2" values="${y2}" keyTimes="${kt}" dur="${dur}s" repeatCount="indefinite" calcMode="spline" keySplines="${splines}"/>`;
    }
    return `<line class="${cls}" x1="${p0[a][0]}" y1="${p0[a][1]}" x2="${p0[b][0]}" y2="${p0[b][1]}">${anim}</line>`;
  }
  function circ(name, cls, r){
    let anim = '';
    if(animated){
      const cx=poses.map(p=>p[name][0]).join(';'), cy=poses.map(p=>p[name][1]).join(';');
      const kt=keyTimes.join(';');
      anim = `<animate attributeName="cx" values="${cx}" keyTimes="${kt}" dur="${dur}s" repeatCount="indefinite" calcMode="spline" keySplines="${splines}"/>
        <animate attributeName="cy" values="${cy}" keyTimes="${kt}" dur="${dur}s" repeatCount="indefinite" calcMode="spline" keySplines="${splines}"/>`;
    }
    return `<circle class="${cls}" cx="${p0[name][0]}" cy="${p0[name][1]}" r="${r}">${anim}</circle>`;
  }
  return `
    <line class="ground-line" x1="10" y1="155" x2="150" y2="155"/>
    ${seg('ankle','toe','seg-foot')}
    ${seg('ankle','knee','seg-limb')}
    ${seg('knee','hip','seg-limb')}
    ${seg('hip','shoulder','seg-torso')}
    ${seg('shoulder','elbow','seg-arm')}
    ${seg('elbow','hand','seg-arm')}
    ${circ('head','head', 10)}
    ${circ('hip','joint',3)}${circ('knee','joint',3)}${circ('shoulder','joint',3)}${circ('elbow','joint',3)}
  `;
}

function levelMult(niveau){ return niveau==='debutant'?0.7:niveau==='avance'?1.3:1; }
function exCount(temps){ return temps==='15'?4:temps==='45'?8:6; }
function setsForNiveau(niveau){ return niveau==='debutant'?2:niveau==='avance'?4:3; }
 
let audioCtx=null;
function playChime(big){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const notes = big ? [523.25, 659.25, 783.99, 1046.5] : [659.25, 880];
    notes.forEach((freq, i)=>{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const t0 = now + i*0.16;
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(0.35, t0+0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t0+0.3);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0+0.32);
    });
  }catch(e){}
  if(navigator.vibrate){ try{ navigator.vibrate(big?[120,60,120,60,160]:[80]); }catch(e){} }
}
 
function buildSession(){
  const mult = levelMult(profile.niveau);
  const n = exCount(profile.temps);
  const sets = setsForNiveau(profile.niveau);
  let pools=[];
  if(profile.objectif==='force') pools=[CATS.force.pool];
  else if(profile.objectif==='cardio') pools=[CATS.cardio.pool];
  else if(profile.objectif==='poids') pools=[CATS.poids.pool];
  else pools=[CATS.force.pool, CATS.cardio.pool, CATS.poids.pool];
 
  let all=[];
  pools.forEach(p=>all=all.concat(p));
  for(let i=all.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; }
  const picked = all.slice(0, Math.min(n, all.length)).map(e=>{
    const val = Math.max(5, Math.round(e.base*mult / (e.type==='time'?5:1)) * (e.type==='time'?5:1));
    return {...e, value:val, sets:sets, doneSets:0, done:false};
  });
  return picked;
}

function screenSession(){
  const wrap = el(`<div>
    <div class="topbar">
      <button class="top-link" id="back-btn">← Quitter</button>
    </div>
    <div class="card">
      <h2 class="display">Ta séance</h2>
      <p class="sub" style="margin-bottom:14px;">Chaque exercice se fait en plusieurs séries. Appuie sur "Voir l'exemple" si tu as besoin d'aide sur la technique.</p>
      <div class="progress-bar"><div class="fill" id="prog-fill" style="width:0%"></div></div>
      <div id="ex-list"></div>
    </div>
    <button class="primary hidden" id="finish-btn">Terminer la séance</button>
  </div>`);
 
  function refreshList(){
    const list = wrap.querySelector('#ex-list');
    list.innerHTML = currentSession.map((e,i)=>{
      const unit = e.type==='reps' ? 'répétitions' : 'secondes';
      const setLabel = e.done ? `${e.sets} séries terminées ✓` : `Série ${e.doneSets+1} / ${e.sets}`;
      return `
      <div class="ex-item ${e.done?'done':''}" data-i="${i}">
        <div class="ex-row">
          <div>
            <div class="ex-name">${e.name}</div>
            <div class="ex-meta">${e.sets} séries × ${e.value} ${unit} · ${e.desc}</div>
            <div class="ex-set-tag">${setLabel}</div>
          </div>
          <div class="ex-check" data-i="${i}">✓</div>
        </div>
        <button class="ex-info-btn" data-info="${i}"><span>i</span>Voir l'exemple</button>
        <div class="ex-steps" data-steps="${i}">
          ${renderDemo(e.demo)}
          <ol>${e.steps.map(s=>`<li>${s}</li>`).join('')}</ol>
        </div>
      </div>`;
    }).join('');
    list.querySelectorAll('.ex-check').forEach(c=>{
      c.addEventListener('click', ()=>{
        const i = parseInt(c.dataset.i);
        const e = currentSession[i];
        if(e.done) return;
        if(e.type==='time'){
          openTimer(i);
        } else {
          e.doneSets++;
          if(e.doneSets>=e.sets){ e.done=true; }
          refreshList();
        }
      });
    });
    list.querySelectorAll('.ex-info-btn').forEach(b=>{
      b.addEventListener('click', ()=>{
        const i = b.dataset.info;
        const panel = list.querySelector(`.ex-steps[data-steps="${i}"]`);
        panel.classList.toggle('open');
      });
    });
    const doneCount = currentSession.filter(e=>e.done).length;
    wrap.querySelector('#prog-fill').style.width = Math.round(doneCount/currentSession.length*100)+'%';
    wrap.querySelector('#finish-btn').classList.toggle('hidden', doneCount===0);
  }
 
  function openTimer(i){
    const ex = currentSession[i];
    let setIndex = ex.doneSets+1;
    let phase = 'work';
    let remaining = ex.value;
    const overlay = el(`<div class="card scoreboard-wrap">
      <div class="scoreboard" id="sb">
        <div class="digits mono" id="timer-digits">${remaining}</div>
        <div class="of" id="timer-label">${ex.name}</div>
        <div class="set-of">Série ${setIndex} / ${ex.sets}</div>
      </div>
      <button class="primary" id="timer-toggle">Démarrer</button>
    </div>`);
    wrap.insertBefore(overlay, wrap.querySelector('#ex-list').parentElement.nextSibling);
    let running=false;
    const digits = overlay.querySelector('#timer-digits');
    const label = overlay.querySelector('#timer-label');
    const sb = overlay.querySelector('#sb');
    const setOf = overlay.querySelector('.set-of');
    const btn = overlay.querySelector('#timer-toggle');
 
    function tick(){
      remaining--;
      digits.textContent = remaining;
      if(remaining<=0){
        clearInterval(timerHandle);
        if(phase==='work'){
          ex.doneSets = setIndex;
          if(setIndex>=ex.sets){
            playChime(true);
            ex.done = true;
            overlay.remove();
            refreshList();
            return;
          } else {
            playChime(false);
            phase='rest';
            remaining=REST_SECONDS;
            label.textContent='Repos avant la série suivante';
            sb.classList.add('resting');
            digits.textContent = remaining;
            running=true; btn.textContent='Pause';
            timerHandle = setInterval(tick,1000);
          }
        } else {
          setIndex++;
          phase='work';
          remaining=ex.value;
          label.textContent=ex.name;
          setOf.textContent=`Série ${setIndex} / ${ex.sets}`;
          sb.classList.remove('resting');
          digits.textContent = remaining;
          running=true; btn.textContent='Pause';
          timerHandle = setInterval(tick,1000);
        }
      }
    }
 
    btn.addEventListener('click', ()=>{
      if(running){ clearInterval(timerHandle); running=false; btn.textContent='Reprendre'; return; }
      running=true; btn.textContent='Pause';
      timerHandle = setInterval(tick,1000);
    });
  }
 
  wrap.querySelector('#back-btn').addEventListener('click', ()=>{ clearInterval(timerHandle); render(screenDashboard()); });
  wrap.querySelector('#finish-btn').addEventListener('click', async ()=>{
    clearInterval(timerHandle);
    playChime(true);
    const today = todayStr();
    if(stats.lastDate !== today){
      const y = new Date(); y.setDate(y.getDate()-1);
      const yesterday = y.toISOString().slice(0,10);
      stats.streak = (stats.lastDate===yesterday) ? stats.streak+1 : 1;
      stats.lastDate = today;
      stats.totalSessions++;
    }
    BADGES.forEach(b=>{ if(b.need(stats) && !stats.badges.includes(b.id)) stats.badges.push(b.id); });
    await saveStats();
    render(screenRecap());
  });
 
  refreshList();
  return wrap;
}

];
 
function matchScore(r, sel){
  if(r.need){
    const matched = r.need.filter(group=>group.some(item=>sel.has(item))).length;
    return {full: matched===r.need.length, score: matched, total: r.need.length};
  }
  if(r.needCategory){
    const matched = r.needCategory.list.filter(item=>sel.has(item)).length;
    return {full: matched>=r.needCategory.min, score: matched, total: r.needCategory.min};
  }
  return {full:false, score:0, total:1};
}
 
function screenFridge(){
  const selected = new Set();
  const wrap = el(`<div>
    <div class="topbar">
      <button class="top-link" id="back-btn">← Quitter</button>
    </div>
    <div class="card">
      <h2 class="display">Mon frigo</h2>
      <p class="sub">Coche ce que tu as sous la main, et reçois des idées de recettes saines. Aucune connexion ni compte nécessaire.</p>
      <div id="food-cats"></div>
      <button class="primary" id="find-recipes-btn">Trouver des recettes</button>
    </div>
    <div id="fridge-result"></div>
  </div>`);
 
  const catsBox = wrap.querySelector('#food-cats');
  catsBox.innerHTML = FOOD_CATEGORIES.map(cat=>`
    <label style="margin-top:16px;">${cat.label}</label>
    <div class="choices" style="flex-wrap:wrap;">
      ${cat.items.map(item=>`<div class="choice food-choice" data-item="${item}" style="min-width:auto; flex:none; padding:8px 12px;">${item}</div>`).join('')}
    </div>
  `).join('');
 
  catsBox.querySelectorAll('.food-choice').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const item = chip.dataset.item;
      if(selected.has(item)){ selected.delete(item); chip.classList.remove('active'); }
      else{ selected.add(item); chip.classList.add('active'); }
    });
  });
 
  wrap.querySelector('#find-recipes-btn').addEventListener('click', ()=>{
    const resultBox = wrap.querySelector('#fridge-result');
    if(selected.size===0){
      resultBox.innerHTML = `<div class="card"><p class="sub center">Coche au moins un aliment pour voir des idées de recettes.</p></div>`;
      return;
    }
    const scored = RECIPES.map(r=>({r, ...matchScore(r, selected)}));
    const full = scored.filter(s=>s.full);
    const partial = scored.filter(s=>!s.full && s.score>0).sort((a,b)=> (b.score/b.total)-(a.score/a.total)).slice(0,3);
 
    let html = '<div class="card">';
    if(full.length){
      html += `<h2 class="display" style="font-size:18px;">Tu peux faire :</h2>`;
      html += full.map(s=>`<div class="recipe-card"><h3>${s.r.nom}</h3><p>${s.r.desc}</p></div>`).join('');
    } else {
      html += `<p class="sub center">Pas encore de recette complète avec ce que tu as coché. Voici ce qui s'en rapproche le plus :</p>`;
    }
    if(partial.length){
      html += `<h2 class="display" style="font-size:16px; margin-top:${full.length?'20px':'6px'};">Presque prêtes (avec un ingrédient de plus)</h2>`;
      html += partial.map(s=>`<div class="recipe-card" style="opacity:0.75;"><h3>${s.r.nom}</h3><p>${s.r.desc}</p></div>`).join('');
    }
    if(!full.length && !partial.length){
      html += `<p class="sub center">Essaie de cocher d'autres aliments pour voir apparaître des recettes.</p>`;
    }
    html += '</div>';
    resultBox.innerHTML = html;
  });
 
  wrap.querySelector('#back-btn').addEventListener('click', ()=>render(screenDashboard()));
  return wrap;
}
 
(async function init(){
  render(el('<div class="center" style="padding-top:80px; color:var(--chalk-dim);">Chargement...</div>'));
  await loadState();
  render(profile ? screenDashboard() : screenOnboarding());
})();
 
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
